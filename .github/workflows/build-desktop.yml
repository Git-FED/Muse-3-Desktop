name: Build Desktop Buddy

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
            artifact: windows

          - os: macos-latest
            flag: --mac
            artifact: macos

          - os: ubuntu-latest
            flag: --linux
            artifact: linux

    defaults:
      run:
        shell: bash

    env:
      CI: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm workflow revision
        run: |
          set -euo pipefail
          echo "Workflow revision: desktop-buddy-no-publish-1"
          echo "Commit: $GITHUB_SHA"

      - name: Verify required files
        run: |
          set -euo pipefail

          for file in \
            package.json \
            package-lock.json \
            assets/icon.png \
            assets/icon.ico \
            assets/icon.icns
          do
            if [[ ! -s "$file" ]]; then
              echo "::error::Missing or empty required file: $file"
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        timeout-minutes: 30
        run: npm ci --foreground-scripts --no-audit --no-fund

      - name: Run project checks
        timeout-minutes: 15
        run: npm run check

      - name: Build desktop application without publishing
        timeout-minutes: 40
        run: npm run dist -- ${{ matrix.flag }} --publish never

      - name: Upload desktop application
        uses: actions/upload-artifact@v4
        with:
          name: desktop-buddy-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error
          retention-days: 14
