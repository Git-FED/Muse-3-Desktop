name: Build Desktop Buddy
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            flag: --win
            artifact: windows
          - os: macos-latest
            flag: --mac
            artifact: macos
          - os: ubuntu-latest
            flag: --linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify desktop icons present
        shell: bash
        run: |
          for f in assets/icon.png assets/icon.ico assets/icon.icns; do test -s "$f" || { echo "Missing required icon: $f"; exit 1; }; done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist -- ${{ matrix.flag }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-buddy-${{ matrix.artifact }}
          path: dist/**
          if-no-files-found: error
